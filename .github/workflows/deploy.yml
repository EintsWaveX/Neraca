name: Deploy to GitHub Pages

# The app is a static build, so it goes out through Pages with no server
# involved. `web/vite.config.ts` sets `base` to the repository name, which is
# what makes asset URLs resolve under eintswavex.github.io/FinancialAM/.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A queued run replaces an older queued run, but an
# in-flight deploy is allowed to finish rather than being cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      # GitHub Pages serves 404.html for any unknown path. Copying the built
      # index there makes client-side routing survive a hard refresh on a deep
      # link, which otherwise returns a real 404 on a static host.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
