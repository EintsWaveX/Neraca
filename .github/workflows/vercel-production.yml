name: Deploy to Vercel

# The release path, replacing the GitHub Pages workflow this project used
# before. Vercel's own Git integration is switched off in vercel.json, so
# production is deployed here and only after the three gates below pass.

# DORMANT ON PURPOSE. GitHub Actions is locked account wide by a billing issue,
# so this workflow cannot run: the last attempt failed in three seconds with
# "The job was not started because your account is locked due to a billing
# issue". Rather than leave the app with no way to deploy at all, Vercel's own
# Git integration was switched back on in vercel.json and the same gates moved
# into its buildCommand, where a failing typecheck, test or bundle budget fails
# the deployment without spending an Actions minute.
#
# This file is kept because it is the better shape once billing clears: the
# gates show up as pull request checks, and deploys go through one reviewable
# path. To restore it, clear the lock, set "deploymentEnabled" back to false in
# vercel.json, drop the buildCommand there, and put the real trigger below
# back. Leaving both live would deploy every change twice.
#
# Kept current with the tree even though it cannot run. The paths below were
# written when the web build lived in web/ and the workspaces did not exist,
# which would have failed on a directory that has not been there since the
# restructure: a confusing error to meet on the day billing clears.

on:
  # The real trigger, restored when the billing lock clears:
  #   push:
  #     branches: [main]
  #     paths:
  #       - 'apps/**'
  #       - 'packages/**'
  #       - 'e2e/**'
  #       - 'package.json'
  #       - 'package-lock.json'
  #       - 'vercel.json'
  #       - '.github/workflows/vercel-production.yml'
  workflow_dispatch:

# Never let two deploys race. A queued run replaces an older queued run, but an
# in-flight deploy is allowed to finish rather than being cancelled halfway.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No working-directory. This is an npm workspace and every script lives at
      # the root, where it reaches across apps/ and packages/ at once.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npm run e2e

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
