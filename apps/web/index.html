<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores both the SVG icon and the web manifest's icon list, so the
         home screen icon has to be declared here as a PNG or it falls back to
         a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The sRGB values of the --paper token in src/index.css, in each theme.
         Kept literal here because neither a meta tag nor a manifest can read a
         CSS custom property. The browser chrome should match the page's own
         ground rather than its accent, or the address bar reads as a stripe of
         unrelated colour above the page. -->
    <meta name="theme-color" content="#f9f6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121929" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neraca</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
