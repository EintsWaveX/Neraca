<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores both the SVG icon and the web manifest's icon list, so the
         home screen icon has to be declared here as a PNG or it falls back to
         a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The sRGB value of the --accent token in src/index.css, matching the
         manifest's theme_color. Kept in both places because neither a manifest
         nor a meta tag can read a CSS custom property. -->
    <meta name="theme-color" content="#008f86" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinancialAM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
